<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Zineedo Z exchange mark</title>
  <desc id="desc">Two opposing green arrows form a Z, with a simple leaf representing reuse.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#178A4B"/>
      <stop offset="1" stop-color="#8EDB2E"/>
    </linearGradient>
    <linearGradient id="bottom" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B4D2C"/>
      <stop offset="1" stop-color="#178A4B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#178A4B"/>
      <stop offset="1" stop-color="#8EDB2E"/>
    </linearGradient>
  </defs>

  <!-- Top/right arrow -->
  <path d="M72 116 H350 V76 L454 170 L350 264 V224 H190
           C171 224 156 216 147 202 L92 202 C65 202 44 182 44 156
           C44 134 56 116 72 116 Z" fill="url(#top)"/>

  <!-- Bottom/left arrow -->
  <path d="M440 396 H162 V436 L58 342 L162 248 V288 H322
           C341 288 356 296 365 310 L420 310 C447 310 468 330 468 356
           C468 378 456 396 440 396 Z" fill="url(#bottom)"/>

  <!-- Simplified leaf -->
  <path d="M258 321 C270 276 305 247 348 239 C344 282 319 319 278 333
           C270 336 263 330 258 321 Z" fill="url(#leaf)"/>
  <path d="M272 321 C291 296 310 278 337 259" fill="none"
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".9"/>
</svg>